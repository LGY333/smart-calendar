<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f4f0" />
    <title>智能日历</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">智能日历</div>
        <div class="month-picker">
          <button class="nav-arrow" id="prev-month" aria-label="上个月">&#8592;</button>
          <h1 id="month-label">2026年9月</h1>
          <button class="nav-arrow" id="next-month" aria-label="下个月">&#8594;</button>
        </div>
        <button class="theme-toggle" id="theme-button" aria-label="切换深浅色">
          <span class="theme-dot"></span>
        </button>
      </header>

      <main class="calendar-viewport" id="calendar-viewport">
        <section class="month">
          <div class="weekday-row" aria-hidden="true">
            <span>一</span>
            <span>二</span>
            <span>三</span>
            <span>四</span>
            <span>五</span>
            <span class="weekend">六</span>
            <span class="weekend">日</span>
          </div>
          <div class="month-grid" id="month-grid"></div>
        </section>
      </main>

      <div class="swipe-hint" id="swipe-hint">上下滑动切换月份</div>

      <section class="task-panel" id="task-panel">
        <div class="task-panel-header">
          <h2 id="task-panel-date"></h2>
          <span class="task-panel-count" id="task-panel-count"></span>
        </div>
        <div class="task-panel-list" id="task-panel-list"></div>
      </section>
    </div>

    <button class="fab" id="fab-add" aria-label="添加日程">+</button>
    <button class="mic-button" id="mic-button" aria-label="语音排程">
      <span class="mic-icon">&#9679;</span>
    </button>

    <div class="modal-backdrop" id="task-modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
        <div class="modal-header">
          <h2 id="task-modal-title">新建日程</h2>
          <button class="icon-button" id="modal-close" aria-label="关闭">&#215;</button>
        </div>
        <div class="modal-body">
          <label class="field">
            <span>标题</span>
            <input id="task-title" type="text" placeholder="日程标题" />
          </label>

          <div class="field-row">
            <label class="field">
              <span>日期</span>
              <input id="task-date" type="date" />
            </label>
            <label class="field check-field">
              <input id="task-all-day" type="checkbox" />
              <span>全天</span>
            </label>
          </div>

          <div class="field-row" id="time-fields">
            <label class="field">
              <span>开始</span>
              <input id="task-start" type="time" />
            </label>
            <label class="field">
              <span>结束</span>
              <input id="task-end" type="time" />
            </label>
          </div>

          <div class="field-row">
            <label class="field">
              <span>优先级</span>
              <select id="task-priority">
                <option value="低">低</option>
                <option value="中" selected>中</option>
                <option value="高">高</option>
              </select>
            </label>
            <label class="field">
              <span>颜色</span>
              <div class="color-swatches" id="color-swatches"></div>
            </label>
          </div>

          <label class="field">
            <span>备注</span>
            <textarea id="task-notes" rows="3" placeholder="备注"></textarea>
          </label>

          <label class="field check-field">
            <input id="task-completed" type="checkbox" />
            <span>标记为已完成</span>
          </label>
        </div>
        <div class="modal-footer">
          <button class="ghost-button danger-button" id="task-delete" type="button" hidden>删除</button>
          <div class="modal-footer-actions">
            <button class="ghost-button" id="task-cancel" type="button">取消</button>
            <button class="primary-button" id="task-save" type="button">保存</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" id="conflict-modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="conflict-title">
        <div class="modal-header">
          <h2 id="conflict-title">时间冲突</h2>
          <button class="icon-button" id="conflict-close" aria-label="关闭">&#215;</button>
        </div>
        <div class="modal-body">
          <div id="conflict-list" class="conflict-list"></div>
          <div class="field">
            <span>处理方案</span>
            <div class="conflict-options" id="conflict-options"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="ghost-button" id="conflict-cancel">取消</button>
          <button class="ghost-button danger-button" id="conflict-keep">仍要保存</button>
        </div>
      </div>
    </div>

    <div class="chat-panel" id="chat-panel" hidden>
      <div class="chat-header">
        <div class="chat-title">
          <span class="chat-live-dot"></span>
          AI 排程助手
        </div>
        <button class="icon-button" id="chat-close" aria-label="关闭">&#215;</button>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="plan-card" id="plan-card" hidden></div>
      <div class="chat-input-row">
        <button class="chat-mic" id="chat-mic" aria-label="语音输入">&#9679;</button>
        <input id="chat-input" type="text" placeholder="例如：帮我加入备考12月六级计划" />
        <button class="chat-send" id="chat-send" aria-label="发送">&#8594;</button>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./main.js"></script>
  </body>
</html>
